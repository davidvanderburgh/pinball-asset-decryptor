name: Build Release Installers

# Builds the installers when a v* tag is pushed and uploads them to a
# GitHub release of the same tag.  The in-app updater (core/updater.py)
# polls the same release endpoint, so a new release auto-notifies users.
#
# Each build job attaches its own asset to the release as soon as it
# finishes -- there is deliberately NO aggregator job.  A single
# "download everything then publish" job gates every asset on the
# slowest build and turns any one job's failure into zero assets
# published.  With per-job attach, Windows/Linux/Apple Silicon are
# downloadable ~3 minutes after the tag.
#
# The Intel mac DMG is NOT here: it takes ~4x the other builds (slow
# free-tier x64 runner), so it lives in release-intel-mac.yml on the
# same tag trigger and backfills its asset to the same release a few
# minutes later.  The release flow watches THIS workflow only; the
# in-app updater gates per-platform (updater._release_ready), so an
# Intel iMac never sees the update banner until its DMG has attached.
#
# Tag a release locally with:
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual run for testing without a tag

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: installer/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" installer/Output/*.exe --clobber

  build-macos:
    # PyInstaller builds for the host arch only and macos-latest has been
    # an Apple Silicon (arm64) runner since 2024, so this job ships the
    # arm64 DMG only; build_macos.sh names the DMG by host arch.  The
    # x86_64 DMG for Intel iMacs builds in release-intel-mac.yml (see
    # the header comment).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          pip install -r requirements.txt pyinstaller UnityPy fsb5 pyogg faster-whisper imageio-ffmpeg
          brew install create-dmg

      - name: Build DMG
        run: bash installer/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: installer/Output/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" installer/Output/*.dmg --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk wget file desktop-file-utils
          pip install -r requirements.txt pyinstaller UnityPy fsb5 pyogg faster-whisper imageio-ffmpeg

      - name: Build AppImage
        run: bash installer/build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: installer/Output/*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" installer/Output/*.AppImage --clobber
