name: Tests

# Runs the test suite on push to main and every pull request, on Linux
# and macOS.  Per-platform setup installs whatever extra tooling those
# tests need (gpg, xvfb).
#
# THE GUI (Tk) TESTS DO NOT RUN HERE, by decision (David, 2026-09-17: "they
# are extremely flaky").  Both legs pass -m "not tk"; conftest.py stamps
# that marker on every test in a module that reaches tkinter, the same set
# it puts on the serial xdist lane.  The last straw was v0.218.2's tripwire:
# 23 test_multiboot_tab Tk tests red on macOS because pytest's own
# unraisable-exception hook crashed (a tracemalloc circular import on the
# runner), on a tree identical to one that had passed a minute earlier.
# This run is the release flow's only test gate and its yank tripwire, so a
# red it cannot mean is worse than a lane it does not run.  The Tk lane was
# also ~3 of the 4 minutes each leg took.  xvfb stays on the Linux leg: the
# sniff is by module source, and a test that reaches Tk only through a GUI
# module import still needs a display there.
#
# THERE IS NO WINDOWS LEG, by decision (David, 2026-09-13).  The release
# flow's ship gate is the full suite green on the developer's own Windows
# box - the same OS and the same Tk build - so a Windows CI run repeated
# that check on the one runner this account queues longest for, and its
# serial Tk lane was the whole job: 375s of a 6-7 minute test step while
# the other three workers idled.  Over the 60 runs before the leg was
# removed it caught ZERO product regressions.  Every one of its reds was an
# xdist worker crashing inside a Tk test (five runs), one test's argv being
# too long for Windows (three), or a test that was wrong on every OS; three
# of those reds yanked a release.  The two remaining legs are where a test
# written on Windows meets other path rules, fonts and probes, which is the
# failure class that has actually surfaced here.  Do not add the leg back
# for a flake or a timing worry; add it back only for a Windows-only
# product bug that the local gate demonstrably could not have caught.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# Only PRs cancel, and only PRs share a group: a new push to a branch
# cancels that branch's older run.  A push to main keys its group on the
# SHA instead, so main's runs neither cancel nor QUEUE BEHIND one another --
# a shared non-cancelling group serializes the runs in it and lets a third
# one evict the pending second, which would delay and then silently drop
# exactly the run /release watches as its post-tag yank tripwire.  A
# tripwire that reports "cancelled" because a later merge landed is a
# tripwire that tells us nothing.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A wedged or looping test should fail the job, not hang for the
    # 6-hour default and hold up a release.  Healthy runs finished in 3-4
    # minutes on both legs with the Tk lane (one worker, ~3m of that); the
    # lane is deselected since 2026-09-17, see the header.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-xdist: the suite runs one worker per core (-n auto).
          pip install pytest pytest-xdist pycryptodome
          # Pillow is in requirements.txt — Williams' DMD render
          # path (dmd_render.py, capture_pipeline.py) imports it at
          # module load, so missing it causes the Williams plugin
          # to silently fail to load and disappear from the
          # manufacturer registry.  Installing requirements.txt
          # picks that up.
          pip install -r requirements.txt

      # gpg is needed for the BOF .fun round-trip + Spooky's GPG-symmetric
      # flows, where the app calls a host-side gpg directly.
      - name: Install gpg + xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnupg xvfb

      - name: Install gpg (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg

      # Tk needs a display on Linux.  xvfb-run wraps the test command
      # with a virtual X server.  The macOS runner can open Tk directly.
      #
      # test_gui_smoke.py is excluded here exactly as it is at the local
      # release gate (the /release command and scripts/testpick.py): it is
      # 147 full App() builds on the serial Tk lane, and the rest of the
      # suite exercises the picker / mfr-switch / log persistence behaviour
      # through the same code.
      #
      # -m "not tk" leaves out every test conftest.py marks as Tk-touching
      # (the header says why).  --dist loadgroup stays: the xdist_group
      # marker rides on the same sniff and is inert for deselected items,
      # and a local run still uses it to keep the lane on its own workers.
      - name: Run tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests -n auto --dist loadgroup -v --ignore=tests/test_gui_smoke.py -m "not tk"

      # The multi-boot card builder's own end-to-end test (item 93): real ext4
      # through debugfs/mke2fs/e2fsck, and - as root, which the hosted runner
      # grants with a passwordless sudo - the loop-mounted in-place update,
      # its crash drill included.  The only automated run of that path.
      - name: Multi-boot card selftest (Linux, root)
        if: runner.os == 'Linux'
        run: sudo -E env PATH="$PATH" python -m pip install -q pycryptodome && sudo -E env PATH="$PATH" python tools/spike2_emu/mkmulticard.py selftest /tmp/mkmulticard-selftest

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest tests -n auto --dist loadgroup -v --ignore=tests/test_gui_smoke.py -m "not tk"
