name: Build the PAD Runtime image

# The Linux the emulator rigs run on, built by us and imported as a private WSL
# distro (see tools/runtime/Dockerfile for what is in it and why).
#
# SEPARATE FROM THE APP RELEASE, exactly like payloads.yml and for the same
# reason: the image is pinned by SHA-256 in pinball_decryptor/core/runtime.py,
# and a hash that changes every app release is not a pin.  Built only when we
# mean to change the runtime, published to an immutable runtime-N tag, and left
# alone by every release after that.
#
# THE PAYLOAD BINARIES COME OUT OF THE APP'S OWN PINS.  This workflow does not
# rebuild qemu-arm and s1hwshim - it downloads the ones payloads.yml published
# and checks them against the SHA-256 core/payloads.py carries, then bakes them
# in.  So there is one build of those binaries in the world, not two, and a
# user on the runtime and a user on their own distro are running identical
# bytes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Runtime release tag (runtime-N). Never reuse one."
        required: true
        default: "runtime-1"
      variant:
        description: "Which package set to build"
        type: choice
        options: [full, base]
        default: full
      publish:
        description: "Upload to the release (off = build and print the pin only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The app is the authority on which binaries belong in the image and what
      # they must hash to.  Asking it here, rather than repeating the values,
      # is what keeps the image and the app from disagreeing about the emulator
      # they each think is installed.
      - name: Fetch the pinned payloads the app expects
        run: |
          python - <<'PY'
          import pathlib, urllib.request
          from pinball_decryptor.core import payloads
          out = pathlib.Path("tools/runtime/payload")
          out.mkdir(parents=True, exist_ok=True)
          for key in ("spike1-qemu", "spike1-hwshim"):
              p = payloads.PAYLOADS[key]
              if not payloads.is_published(p):
                  raise SystemExit("%s has no pinned hash yet - cut payloads first" % key)
              dest = out / p.filename
              urllib.request.urlretrieve(payloads.asset_url(p), dest)
              ok, why = payloads.verify(str(dest), p)
              if not ok:
                  raise SystemExit("%s: %s" % (p.filename, why))
              # The stamp the app would have written, so the rig's
              # "is this binary for these sources" rule works inside the image.
              (out / (p.filename + payloads.STAMP_SUFFIX)).write_text(
                  payloads.stamp_text(p), encoding="utf-8")
              print("verified %s (%d bytes)" % (p.filename, p.size))
          PY

      # STAGED, NOT COPIED OUT.  The image installs GDRE Tools by running the
      # app's own installer script, so the version, URL and SHA-256 have one
      # home (installer/install_gdre.sh) instead of a second copy in a
      # Dockerfile that would drift the first time one of them changed.  The
      # build context is tools/runtime, so the file has to come to it.
      - name: Stage the GDRE Tools installer for the image
        run: |
          cp installer/install_gdre.sh tools/runtime/payload/install_gdre.sh
          grep -q 'SHA256=' tools/runtime/payload/install_gdre.sh \
            || { echo "install_gdre.sh no longer pins a hash"; exit 1; }

      # THE APP DECIDES WHAT VERSION THIS IMAGE IS.  Read out of core/runtime.py
      # rather than written down twice - see the check after the selftest for
      # what the second copy cost.
      - name: Build the image
        run: |
          V=$(python -c "from pinball_decryptor.core import runtime; print(runtime.RUNTIME_VERSION)")
          echo "the app expects runtime version $V"
          docker build tools/runtime \
            --build-arg VARIANT=${{ inputs.variant }} \
            --build-arg RUNTIME_VERSION="$V" \
            --build-arg BUILD_STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t pad-runtime:${{ inputs.tag }}

      # `docker export` is the container's filesystem with no image metadata -
      # which is exactly what `wsl --import` wants, and is NOT the same as
      # `docker save` (that produces layers WSL cannot read).
      - name: Export the rootfs
        run: |
          CID=$(docker create pad-runtime:${{ inputs.tag }})
          mkdir -p out
          docker export "$CID" | gzip -9 > out/pad-runtime-${{ inputs.variant }}.tar.gz
          docker rm "$CID"
          ls -l out/

      # A rootfs that cannot start is not a runtime.  This runs the image's own
      # python and the emulator we baked into it, and checks the account the rig
      # looks up by number - the three things whose absence would only show up
      # on a user's machine, minutes into a first run.
      - name: Prove the image can actually run the rig's pieces
        run: |
          docker run --rm pad-runtime:${{ inputs.tag }} bash -c '
            set -e
            python3 -c "import json,struct,zlib,termios; print(\"python\", __import__(\"sys\").version.split()[0])"
            getent passwd 1000
            /home/pad/qemubuild/qemu-arm --version | head -1
            /home/pad/s1hwshim 2>&1 | head -1 || true
            test -x /home/pad/s1emu/s1hwshim
            cat /etc/pad-runtime.json
            for t in pgrep unshare setsid socat mount; do command -v $t >/dev/null || { echo "missing: $t"; exit 1; }; done
            echo "image selftest OK"
          '
          # THE STAMP MUST BE THE ONE THE APP WILL ACCEPT.  An image whose
          # manifest disagrees with the app imports perfectly and is then
          # rejected as "not ours" - after the user has downloaded all of it,
          # which is exactly what happened when the Dockerfile carried its own
          # copy of the version and a bump landed only in the app.
          V=$(python -c "from pinball_decryptor.core import runtime; print(runtime.RUNTIME_VERSION)")
          GOT=$(docker run --rm pad-runtime:${{ inputs.tag }} \
                  python3 -c "import json;print(json.load(open('/etc/pad-runtime.json'))['runtime_version'])")
          test "$GOT" = "$V" || { echo "the image says version $GOT, the app expects $V"; exit 1; }
          echo "the image stamps the version the app expects ($V)"

      # EVERY CHECK IS ITS OWN STATEMENT, ending in `|| fail`, and that shape
      # is not style.  Written as `check && echo "it works"`, a FAILING check
      # is exempt from `set -e` - only the last command of an && list is
      # checked - so the step prints nothing, skips to the next line and
      # passes.  That is exactly what happened: this image shipped without
      # file(1), the busybox assertion silently did nothing, "busybox is
      # static" never printed, and the step reported success.  A verification
      # harness that can pass over its own failures is worse than none.
      #
      # THE SPIKE 2 SET, CHECKED BY NAME AND BY RUNNING IT.  `command -v` alone
      # would pass for a cross compiler that cannot compile and a criu that
      # cannot load its libraries - and a criu copied out of a build stage is
      # exactly the thing whose shared libraries can be missing.  So each one
      # is asked to do its job, in the image, before anyone downloads it.
      #
      # THE ARM SIDE TOOK TWO WRONG TURNS BEFORE THIS SHAPE, and both are worth
      # remembering.  The rig LINKS its guest code against the CARD's own libc
      # (`-L$R/lib -l:libc.so.6`), because it has to match the glibc 2.21 the
      # game ships with - so the first check compiled an ordinary `int main`
      # and died on a missing crt1.o, and the conclusion drawn was "the image
      # needs no ARM libc".  The second check therefore compiled a freestanding
      # `_start` and passed happily... while the rig's REAL hwshim.c would not
      # build at all, because it includes setjmp.h and `-nostdlib` governs the
      # LINK, not the includes.  The image carries libc6-dev-armhf-cross for
      # the headers, and the step below compiles the actual sources.
      - name: Prove the Spike 2 toolchain works
        if: ${{ inputs.variant == 'full' }}
        run: |
          docker run --rm pad-runtime:${{ inputs.tag }} bash -c '
            set -e
            fail() { echo "FAILED: $1"; exit 1; }
            for t in qemu-arm-static arm-linux-gnueabihf-gcc gcc debugfs                      fusermount3 fuse2fs ffmpeg busybox criu make patch zstd                      xxd file; do
              command -v $t >/dev/null || fail "missing: $t"
            done
            criu --version || fail "criu will not run (its libraries did not come across?)"
            arm-linux-gnueabihf-gcc --version | head -1
            echo "int main(void){return 0;}" > /tmp/t.c
            gcc -o /tmp/t.native /tmp/t.c || fail "the native compiler cannot compile"
            /tmp/t.native || fail "what the native compiler built will not run"
            arm-linux-gnueabihf-gcc -static -o /tmp/t.arm /tmp/t.c || fail "the cross compiler cannot compile"
            qemu-arm-static /tmp/t.arm || fail "an ARM program will not run under the interpreter"
            echo "an ARM program ran under the interpreter"
            ffmpeg -hide_banner -f lavfi -i testsrc=size=64x64:rate=1 -frames:v 1                    -c:v libx264 -f null - 2>/dev/null || fail "ffmpeg cannot encode H.264"
            echo "ffmpeg decodes and encodes H.264"
            file "$(command -v busybox)" | grep -q "statically linked"               || fail "busybox is not static, so the save-state boot has no umount"
            echo "busybox is static, so the pivot boot has its umount"
            echo "spike 2 toolchain OK"
          '

      # THE PIPELINE TOOLS, and the same rule applies: asked to do their job,
      # not merely to be on PATH.  These are what the extract and write paths
      # shell out to for every manufacturer, and the app routes those here now
      # - so a tool missing or unable to run is a user whose Write fails
      # halfway through, on a machine that was working before he installed our
      # Linux.  GDRE Tools especially: it is a Godot binary that opens a
      # display even when told to be headless, so it is run the way the BOF
      # pipeline runs it (LD_LIBRARY_PATH + xvfb-run), not merely stat'ed.
      - name: Prove the pipeline tools work
        if: ${{ inputs.variant == 'full' }}
        run: |
          docker run --rm pad-runtime:${{ inputs.tag }} bash -c '
            set -e
            fail() { echo "FAILED: $1"; exit 1; }
            for t in gpg partclone.ext4 xorriso pigz curl unzip cwebp xvfb-run tar fuser killall rsync partprobe modprobe; do
              command -v $t >/dev/null || fail "missing: $t"
            done
            gpg --version | head -1
            partclone.ext4 --help 2>&1 | head -1
            xorriso -version 2>&1 | head -2
            python3 -c "import zstandard; print(\"python3-zstandard\", zstandard.__version__)" || fail "the app python cannot import zstandard"
            printf "P6\n1 1\n255\n\0\0\0" > /tmp/p.ppm
            cwebp -quiet /tmp/p.ppm -o /tmp/p.webp || fail "cwebp cannot encode"
            test -s /tmp/p.webp || fail "cwebp wrote nothing"
            echo "cwebp encodes"
            test -x /opt/gdre_tools/gdre_tools.x86_64 || fail "GDRE Tools is not installed"
            # JUDGED ON WHAT IT SAYS, NOT ON WHAT IT RETURNS.  GDRE prints its
            # own banner and then exits non-zero for `--version` (Godot treats
            # a run with no work to do as a failure), so an `|| fail` here
            # rejects an image whose GDRE is perfectly fine - which is what
            # this step did on its first run.  The banner is the proof that
            # matters anyway: it means the binary started under xvfb and found
            # its libraries, which is the whole question.
            said=$(LD_LIBRARY_PATH=/opt/gdre_tools xvfb-run -a \
                     /opt/gdre_tools/gdre_tools.x86_64 --headless --version 2>&1 || true)
            case "$said" in
              *"Godot RE Tools"*) echo "GDRE Tools runs headless: $said" ;;
              *) fail "GDRE Tools did not start under xvfb (the way the BOF pipeline runs it): $said" ;;
            esac
            # modprobe is asked to do its job, not merely to exist: usbipd
            # runs it INSIDE this distro to load vhci_hcd, which is how the
            # JJP dongle reaches WSL at all.  There is no kernel under docker
            # to load a module into, so the proof here is that it runs and
            # reports a missing module rather than a missing program - the
            # error the image actually shipped with was "The 'modprobe'
            # command is unavailable".
            said=$(modprobe --dry-run vhci_hcd 2>&1 || true)
            case "$said" in
              *"not found"*|*"can't open"*|*"Module"*|"") echo "modprobe runs: ${said:-clean}" ;;
              *unavailable*) fail "modprobe is not installed: $said" ;;
              *) echo "modprobe runs: $said" ;;
            esac
            echo "pipeline tools OK"
          '

      # THE RIG'S OWN SOURCES, COMPILED WITH THE IMAGE'S OWN TOOLCHAIN, and
      # this is the check that matters.  A stand-in file proves nothing: the
      # first version of this step compiled a freestanding `_start` and passed,
      # while the real hwshim.c - which includes setjmp.h - died on a missing
      # bits/wordsize.h, because -nostdlib governs the LINK and not the
      # includes.  A user would have met that as their first Spike 2 start.
      - name: Build the rig's actual shim and renderer in the image
        if: ${{ inputs.variant == 'full' }}
        run: |
          docker run --rm -v "$PWD:/repo" pad-runtime:${{ inputs.tag }} bash -c '
            set -e
            W=$(mktemp -d); cd "$W"
            cp /repo/tools/spike2_emu/{hwshim.c,alsastub.c,gststub.c,gstvid.c,padvid.h,padsw.h} .
            arm-linux-gnueabihf-gcc -std=gnu17 -fno-stack-protector -shared -fPIC               -O2 -nostdlib -Werror=implicit-function-declaration               -Wl,-soname,hwshim.so -o hwshim.so               hwshim.c alsastub.c gststub.c gstvid.c
            echo "the guest shim built: $(stat -c%s hwshim.so) bytes"
            gcc -std=gnu17 -O2 -Wall -Werror=implicit-function-declaration               -o padglhost /repo/tools/spike2_emu/padglhost.c               -l:libEGL.so.1 -l:libX11.so.6
            echo "the host renderer built: $(stat -c%s padglhost) bytes"
          '

      # For the record, and not as a gate: the RIG'S OWN read-only verdict on
      # the image, from the same script the app runs on a user's machine.
      - name: What the rig itself says about this image
        if: ${{ inputs.variant == 'full' }}
        run: |
          docker run --rm -v "$PWD:/repo" pad-runtime:${{ inputs.tag }}             bash /repo/tools/spike2_emu/setupcheck.sh 2>&1 | head -40 || true

      - name: Print the pin
        run: |
          F=out/pad-runtime-${{ inputs.variant }}.tar.gz
          {
            echo "Paste into pinball_decryptor/core/runtime.py:"
            echo "  release_tag : ${{ inputs.tag }}"
            echo "  filename    : $(basename "$F")"
            echo "  sha256      : $(sha256sum "$F" | cut -d' ' -f1)"
            echo "  size        : $(stat -c%s "$F")"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pad-runtime-${{ inputs.variant }}
          path: out/*

      - name: Publish
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum *.tar.gz > SHA256SUMS)
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 \
            || gh release create "${{ inputs.tag }}" --prerelease \
                 --title "PAD Runtime ${{ inputs.tag }}" \
                 --notes "The Linux the emulator rigs run on, imported as a private WSL distro. Pinned by SHA-256 in pinball_decryptor/core/runtime.py."
          # MARKED PRERELEASE BECAUSE IT MUST NEVER BE "Latest", and that flag
          # is the only one that does it.  This release carries no app, but
          # every copy of the app already installed asks GitHub for the latest
          # release and compares THAT tag to its own version - publishing
          # runtime-1 into the top slot told a tester on v0.191.0 he was up to
          # date with v0.192.0 released the same day (PAD-116).  Newer builds
          # read the release list instead; the ones already out there cannot be
          # fixed from here, which is what this line is for.
          #
          # --latest=false does NOT do this, however much it reads like it
          # does: it only un-pins the release, and GitHub then recomputes the
          # latest one by creation date and lands right back on this one
          # (verified against the live API on runtime-1).  /releases/latest is
          # documented as the newest NON-PRERELEASE, non-draft release, so
          # prerelease is the flag with teeth.  Applied unconditionally below
          # so a tag created before we knew this is corrected on a re-run.
          gh release edit "${{ inputs.tag }}" --prerelease
          gh release upload "${{ inputs.tag }}" out/*.tar.gz out/SHA256SUMS
