name: Build Intel Mac Installer

# The x86_64 DMG for Intel iMacs, split out of release.yml because it is
# the slowest build by ~4x (~8 min vs ~3 for everything else -- the
# macos-15-intel free-tier runner is slow hardware) and it must not sit
# on the release critical path.  It runs on the same v* tag, attaches
# its DMG to the same GitHub release when it finishes, and nothing
# watches or waits for it: the in-app updater gates per-platform
# (updater._release_ready), so an Intel iMac simply doesn't see the
# update banner until this asset has attached.
#
# The attach is the same bounded, retried script release.yml uses (see the
# header there): an upload that GitHub leaves hanging is killed after
# about a minute and a half (sized to the 155 MB DMG) and retried on a
# fresh connection, and the artifact uploaded just before it is the
# fallback source if the retries run out.
#
# macos-15-intel is a standard (free-tier) x64 label, unlike -large.
# Note the Intel wheel floors: onnxruntime resolves to 1.23.x there
# (last release with a macOS x86_64 wheel), which needs macOS 13+.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual run for testing without a tag

permissions:
  contents: write

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    # Healthy: 8-10 minutes, all of it the build.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          pip install -r requirements.txt -r requirements-build.txt
          brew install create-dmg

      - name: Build DMG
        run: bash installer/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-x86_64
          path: installer/Output/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/attach_release_asset.sh "$GITHUB_REF_NAME" installer/Output/*.dmg
