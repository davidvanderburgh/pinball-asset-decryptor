# The animal shelter donations Worker (PAD-754).  See README.md.
name = "pad-donations"
main = "worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "pad-donations"
# `wrangler d1 create pad-donations` prints the id; paste it here.
database_id = "PASTE-THE-DATABASE-ID-HERE"

# Secrets (never in this file): wrangler secret put APP_KEY / ADMIN_KEY / IP_SALT
