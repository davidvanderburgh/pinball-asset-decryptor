name: Build Release Installers

# Builds the installers when a v* tag is pushed and attaches them to a
# GitHub release of the same tag.  The in-app updater (core/updater.py)
# polls the same release endpoint, so a new release auto-notifies users.
#
# THE TARGET IS FIVE MINUTES from the developer triggering /release to the
# Windows installer being downloadable (David, 2026-09-17), and everything
# in here is shaped by that:
#
# - Each build job attaches its own asset the moment it finishes -- there
#   is deliberately NO aggregator job.  A "download everything then
#   publish" job gates every asset on the slowest build and turns one
#   job's failure into zero assets published.
#
# - The attach goes through .github/scripts/attach_release_asset.sh, which
#   puts a deadline of about a minute (sized to the file) on each upload
#   and retries on a fresh connection.  A bare `gh release upload` has no
#   time limit: on
#   2026-09-17 GitHub's upload endpoint went erratic, single uploads sat
#   16-30 minutes before failing, and v0.218.0 had no Windows asset for an
#   hour.  The step and the job carry timeouts as well, so nothing can hold
#   a release run open for the 6-hour default.
#
# - The Actions artifact is uploaded BEFORE the attach, on purpose: it is
#   the fallback source when the attach's retries run out (/release
#   re-attaches from it, from the developer's machine, whose upload path is
#   not the runners'), so it has to exist by the time the attach starts
#   struggling.  Its 3-8 seconds are the price of that.
#
# - The Intel mac DMG is NOT here: it takes ~4x the other builds (slow
#   free-tier x64 runner), so it lives in release-intel-mac.yml on the same
#   tag trigger and backfills its asset to the same release a few minutes
#   later.  The release flow watches THIS workflow only; the in-app updater
#   gates per-platform (updater._release_ready), so an Intel iMac never
#   sees the update banner until its DMG has attached.
#
# Tag a release locally with:
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual run for testing without a tag

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # Healthy: under 3 minutes.  The critical path of every release.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      # PAD-1581: the bundled Python (embeddable + get-pip + the pinned
      # deps) is ~50 s of this job and the same for every release that
      # changes only the app's own files, so it is kept between runs.  The
      # key is everything build.ps1 reads to make it (it checks the same
      # fingerprint itself before using a restored copy) plus the month, so
      # the unpinned pip/setuptools/wheel it carries still refresh.  On a
      # miss build.ps1 makes it as before and leaves a copy that this step
      # saves at the end of the job - after the installer is attached, off
      # the release's critical path.  The Inno Setup compress (~60 s) is NOT
      # cacheable: ISCC re-compresses its whole solid stream every build.
      - name: Bundled Python cache key
        id: pybundle
        shell: pwsh
        run: '"month=$(Get-Date -Format yyyy-MM)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT'

      - name: Restore the bundled Python
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pad-python
          key: pad-python-win-${{ steps.py.outputs.python-version }}-${{ steps.pybundle.outputs.month }}-${{ hashFiles('installer/build.ps1', 'requirements.txt', 'requirements-windows.txt', 'requirements-ui.txt') }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: installer/build.ps1 -PythonCache (Join-Path $env:RUNNER_TEMP 'pad-python')

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/*.exe

      # PAD-1519: the file list and pack an installed copy updates from
      # without downloading the setup exe (installer/make_delta.py).
      # BEFORE the exe is attached - the app offers a release the moment
      # its exe is up, and must find the file list there by then - and
      # never in its way: a failure here only means this release updates
      # the old way.  Healthy: ~20 s (a pack of the changed files only).
      - name: Build and attach delta-update assets
        id: delta
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build_delta_assets.sh "$GITHUB_REF_NAME"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/attach_release_asset.sh "$GITHUB_REF_NAME" installer/Output/*.exe

  # PAD-1519 tripwire: install the REAL setup exe the way the in-app update
  # does (/STAGED=2, into a scratch folder) and compare what lands with the
  # release's file list.  They are made from the same [Files] section by two
  # readers - Inno Setup and installer/make_delta.py - and a copy updated
  # from a file list that disagrees with the installer is missing a file
  # until the next release.  So a difference takes the file list and pack
  # off the release (the app then uses the setup exe) and turns this job
  # red.  Its own job, after the build: it is not on the release's critical
  # path and never reddens the installer build.
  check-delta:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the setup exe and compare it with the file list
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $dl = Join-Path $env:RUNNER_TEMP 'pad-delta-check'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          gh release download $tag --pattern '*_Windows.delta.json.gz' --dir $dl
          $list = Get-ChildItem $dl -Filter '*.delta.json.gz' | Select-Object -First 1
          if (-not $list) {
            Write-Host "::notice::$tag has no delta file list (its build step did not attach one) - nothing to check"
            exit 0
          }
          gh release download $tag --pattern '*_Windows.exe' --dir $dl
          $exe = Get-ChildItem $dl -Filter '*_Windows.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'pad-delta-install'
          $problem = ''
          if (-not $exe) { $problem = 'the setup exe could not be downloaded' }
          else {
            $p = Start-Process -FilePath $exe.FullName -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOCLOSEAPPLICATIONS',
              '/STAGED=2', '/MERGETASKS="!runprereqs,!desktopicon"', "/DIR=`"$dir`"")
            if ($p.ExitCode -ne 0) { $problem = "the setup exe stopped with code $($p.ExitCode)" }
            else {
              python installer/make_delta.py --verify $dir --manifest $list.FullName
              if ($LASTEXITCODE -ne 0) { $problem = 'the file list does not match what the setup exe installs' }
            }
          }
          if ($problem) {
            # unproven is treated as wrong: the app falls back to the exe
            $pack = $list.Name -replace '\.delta\.json\.gz$', '.delta.pack'
            gh release delete-asset $tag $list.Name --yes
            gh release delete-asset $tag $pack --yes
            Write-Host "::error::$problem - the delta assets were taken off $tag; in-app updates to it use the setup exe"
            exit 1
          }
          Write-Host "the file list matches the setup exe"

  build-macos:
    # PyInstaller builds for the host arch only and macos-latest has been
    # an Apple Silicon (arm64) runner since 2024, so this job ships the
    # arm64 DMG only; build_macos.sh names the DMG by host arch.  The
    # x86_64 DMG for Intel iMacs builds in release-intel-mac.yml (see
    # the header comment).
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          pip install -r requirements.txt -r requirements-build.txt
          brew install create-dmg

      - name: Build DMG
        run: bash installer/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: installer/Output/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/attach_release_asset.sh "$GITHUB_REF_NAME" installer/Output/*.dmg

  build-linux:
    # The oldest supported runner: the AppImage runs only on a glibc at least
    # as new as the build machine's (PAD-837; build_linux.sh checks it).
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget file desktop-file-utils
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build AppImage
        run: bash installer/build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: installer/Output/*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/attach_release_asset.sh "$GITHUB_REF_NAME" installer/Output/*.AppImage
