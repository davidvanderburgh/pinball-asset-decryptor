[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -n auto --dist loadgroup: the suite is parallel BY DEFAULT (2026-09-01,
# David's 1-minute target; it was 10 minutes single-process).  loadgroup +
# conftest's xdist_group markers keep Tk tests safe: one serial group on CI,
# per-module groups locally.  Debugging escape hatches: `-n 0` disables
# xdist for a run (required for --pdb, which xdist refuses).
addopts =
    -ra
    --strict-markers
    --tb=short
    -n auto
    --dist loadgroup
markers =
    requires_gpg: needs a host-side gpg binary on PATH (BOF flow, some Spooky flows)
    requires_display: needs a usable Tk display (xvfb on Linux CI)
    requires_wsl: needs WSL2 + Ubuntu (Windows-only; skipped elsewhere)
    requires_docker: needs Docker Desktop (macOS Clonezilla flow)
    slow: takes more than a couple of seconds
    gui: builds a full Tk App() instance (~0.5s setup each) — deselect with
        -m "not gui" for a fast logic-only dev run; the full suite runs them
    tk: touches Tk at all — stamped by conftest.py on every test in a module
        that reaches tkinter (the same sniff that puts them on the serial
        xdist lane).  CI deselects it with -m "not tk" (David, 2026-09-17:
        the GUI tests are out of the pipeline, too flaky on hosted runners);
        a local run still includes them unless you pass that yourself
