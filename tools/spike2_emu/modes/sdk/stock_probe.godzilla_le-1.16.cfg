# stock_probe.c config: Godzilla Premium/LE 1.16 (godzilla_le/game, sha1
# ea8c6d36f130bfe1421b36c0a071bc66c9be4e99). Copy it to /dump/stockprobe.cfg with the
# game's port as /dump/game.port. Every address was read off that ELF (desk); the probe
# checks the words it calls and each rule's vtable before it writes anything.
game     godzilla_le
version  1.16

# cmode_manager_get(manager, id): cmp r1,#26 ; push {r3,lr} ; returns the word at
# 0x7b4aa8 + 4 * id (27 rules, ids 0..26)
get      0xd3fa0 0xe351001a 0xe92d4008
# the manager singleton (the port's `data stock_mode_manager`)
mgr      0x7b0ce4
# vtable slots on this build: start 8, stop 11, lit-shot query 25 and active 14 are Pro
# 1.15's; the shot handler 42 and the initial-mask getter 45 are one higher than Pro 1.15's
# (41, 44): this build added a slot at 41
slots    start 8 stop 11 shot 42 lit 25 active 14 mask 45
# cmode's per-player shot mask: u64 at obj + 0x18 + 8 * player (cmode::v[42] 0x7eafc)
field    0x18
# cmode_manager::v[29]: every active rule's v[25], ORed (what the game lights)
gamelit  0xd3eb8 0xe92d40f8 0xe3a06000
# the award calls a rule's code makes (Pro 1.15 + 0x150): caward_add and caward_build take
# the value in r2:r3
award    caward_add   0x2fc1c 0xe92d41f0 0xe1a04000
award    caward_build 0x2f8d4 0xe92d4ff8 0xe1a0b000
# (award, notify, index, multiplier): the tank's Maser hit scores through it (0x10a090)
award    caward_add_scaled 0x2fcdc 0xe92d4ff8 0xe1a09002
# cmode_manager::v[7], the port's shot_dispatch (the SYNTHETIC shot trigger only)
dispatch 0xd3e2c

# 4 cmode_tank_attack_multiball (obj 0x7b4f30): level at +0x70 + 4p, tanks destroyed at
# +0xa8, the tank records (a vector at +0x68 of 40-byte records: active byte +0, its
# position mask u64 +8)
watch 4  tank_attack_mb vt 0x640820 pw 0x70 w 0xa8 vec 0x68 40 0 8
# 12 cmode_battle_vs_ebirah (obj 0x7b53f0): spins left per player on the left spinner
# (+0x8c + 4p), top spinner (+0x9c + 4p) and shield ramp spinner (+0xac + 4p)
watch 12 battle_ebirah  vt 0x636d78 pw 0x8c pw 0x9c pw 0xac
